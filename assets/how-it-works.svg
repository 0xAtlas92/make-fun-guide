<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="220" viewBox="0 0 1000 220" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#57606a"/>
    </marker>
  </defs>
  <rect width="1000" height="220" rx="12" fill="#f6f8fa"/>
  <text x="500" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2328">How make.fun works</text>
  <g font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">
    <g>
      <rect x="20" y="60" width="160" height="100" rx="10" fill="#ffffff" stroke="#d0d7de"/>
      <text x="100" y="92" font-size="26">🎯</text>
      <text x="100" y="120">Pick a bounty</text>
      <text x="100" y="142" font-size="11" font-weight="400" fill="#57606a">task, rules, deadline,</text>
      <text x="100" y="157" font-size="11" font-weight="400" fill="#57606a">prize in USDC</text>
    </g>
    <g>
      <rect x="220" y="60" width="160" height="100" rx="10" fill="#ffffff" stroke="#d0d7de"/>
      <text x="300" y="92" font-size="26">🤖</text>
      <text x="300" y="120">Build with your agent</text>
      <text x="300" y="142" font-size="11" font-weight="400" fill="#57606a">agent writes the code,</text>
      <text x="300" y="157" font-size="11" font-weight="400" fill="#57606a">you steer it</text>
    </g>
    <g>
      <rect x="420" y="60" width="160" height="100" rx="10" fill="#ffffff" stroke="#d0d7de"/>
      <text x="500" y="92" font-size="26">📤</text>
      <text x="500" y="120">Submit the repo</text>
      <text x="500" y="142" font-size="11" font-weight="400" fill="#57606a">public GitHub repo +</text>
      <text x="500" y="157" font-size="11" font-weight="400" fill="#57606a">agent transcripts</text>
    </g>
    <g>
      <rect x="620" y="60" width="160" height="100" rx="10" fill="#ffffff" stroke="#d0d7de"/>
      <text x="700" y="92" font-size="26">✅</text>
      <text x="700" y="120">Checked &amp; scored</text>
      <text x="700" y="142" font-size="11" font-weight="400" fill="#57606a">same grading for every</text>
      <text x="700" y="157" font-size="11" font-weight="400" fill="#57606a">entry, in a sandbox</text>
    </g>
    <g>
      <rect x="820" y="60" width="160" height="100" rx="10" fill="#ddf4ff" stroke="#54aeff"/>
      <text x="900" y="92" font-size="26">💰</text>
      <text x="900" y="120">Win USDC</text>
      <text x="900" y="142" font-size="11" font-weight="400" fill="#57606a">claim to your Solana</text>
      <text x="900" y="157" font-size="11" font-weight="400" fill="#57606a">wallet within 7 days</text>
    </g>
  </g>
  <g stroke="#57606a" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="180" y1="110" x2="216" y2="110"/>
    <line x1="380" y1="110" x2="416" y2="110"/>
    <line x1="580" y1="110" x2="616" y2="110"/>
    <line x1="780" y1="110" x2="816" y2="110"/>
  </g>
  <text x="500" y="200" text-anchor="middle" font-size="12" fill="#57606a">Free to enter for most bounties · Prize locked in on-chain escrow before the bounty opens</text>
</svg>
